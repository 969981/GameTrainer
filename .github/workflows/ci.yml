name: GameTrainer Continuous Integration

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-core:
    name: Rust core registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Rust formatting
        run: cargo fmt --all -- --check
      - name: Core clippy
        run: cargo clippy -p trainer-core -p trainer-mgba -p trainer-rs -p trainer-rsp -p trainer-live -p trainer-frlg -p trainer-patch -p trainer-storage --all-targets -- -D warnings
      - name: Core unit tests
        run: cargo test -p trainer-core -p trainer-mgba -p trainer-rs -p trainer-rsp -p trainer-live -p trainer-frlg -p trainer-patch -p trainer-storage

  frontend:
    name: React UI & Mock registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: ESLint
        run: pnpm lint
      - name: TypeScript
        run: pnpm typecheck
      - name: UI/registry tests
        run: pnpm test
      - name: Production web build
        run: pnpm build
      - name: Install Chromium for layout checks
        run: pnpm --filter @gametrainer/desktop exec playwright install --with-deps chromium
      - name: Responsive browser layout tests
        run: pnpm --filter @gametrainer/desktop test:e2e
      - name: Publish viewport screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m0-browser-layouts
          path: apps/desktop/test-results/screenshots/
          if-no-files-found: ignore

  windows-shell:
    name: Windows Tauri 2 shell compile
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
        with:
          version: 10.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install frontend
        run: pnpm install --no-frozen-lockfile
      - name: Build frontend assets
        run: pnpm build
      - name: Check Tauri Windows shell
        run: cargo check -p game-trainer-desktop
      - name: Test desktop catalog command
        run: cargo test -p game-trainer-desktop --lib
      - name: Compile launchable Windows EXE
        run: cargo build -p game-trainer-desktop
      - name: Upload desktop smoke-test EXE
        uses: actions/upload-artifact@v4
        with:
          name: gametrainer-m0-m1-win64-debug
          path: target/debug/game-trainer-desktop.exe
          if-no-files-found: error
          retention-days: 7
