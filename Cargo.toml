[workspace]
members = ["crates/trainer-core", "crates/trainer-mgba", "crates/trainer-runtime-win", "crates/trainer-rs", "crates/trainer-rsp", "crates/trainer-live", "crates/trainer-frlg", "crates/trainer-hgss", "crates/trainer-patch", "crates/trainer-storage", "apps/desktop/src-tauri"]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
