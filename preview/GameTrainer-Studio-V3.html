<script>
const I=n=>`<svg class="ico" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const platforms=[{id:'all',label:'全部游戏',short:'全部'},{id:'gen3',label:'Gen 3 · GBA',short:'Gen 3'},{id:'gen4',label:'Gen 4 · NDS',short:'Gen 4'},{id:'gen5',label:'Gen 5 · NDS',short:'Gen 5'},{id:'gen6',label:'Gen 6 · 3DS',short:'Gen 6'},{id:'pc',label:'Windows 原生',short:'PC 原生'}];
const defaultGames=[
{id:'emerald',title:'Pokémon Emerald',zh:'宝可梦 绿宝石',platform:'gen3',generation:'GEN III',runtime:'mGBA',transport:'Emulator',status:'首个迁移目标',symbol:'III',accent:['#166b63','#173b67'],modules:['rng','seed','encounter','warp','party','save'],summary:'基于现有 v5.3.0 CE/Lua 迁移计划；版本验证是写入前置条件。'},
{id:'firered',title:'Pokémon FireRed / LeafGreen',zh:'宝可梦 火红 / 叶绿',platform:'gen3',generation:'GEN III',runtime:'mGBA',transport:'Emulator',status:'规划模板',symbol:'III',accent:['#8f493e','#513657'],modules:['rng','encounter','party','save'],summary:'共享 Gen3 数据模型；独立 ROM 地址与功能验证。'},
{id:'platinum',title:'Pokémon Platinum',zh:'宝可梦 白金',platform:'gen4',generation:'GEN IV',runtime:'melonDS（候选）',transport:'Emulator',status:'规划模板',symbol:'IV',accent:['#556680','#303e70'],modules:['rng','encounter','party','save'],summary:'NDS 独立内存映射与 Gen4 数据解码。'},
{id:'heartgold',title:'Pokémon HeartGold / SoulSilver',zh:'宝可梦 心金 / 魂银',platform:'gen4',generation:'GEN IV',runtime:'melonDS（候选）',transport:'Emulator',status:'规划模板',symbol:'IV',accent:['#88734a','#4c4c5d'],modules:['rng','encounter','party','save'],summary:'同世代共用组件，游戏补丁与 profile 独立。'},
{id:'black2',title:'Pokémon Black 2 / White 2',zh:'宝可梦 黑2 / 白2',platform:'gen5',generation:'GEN V',runtime:'melonDS（候选）',transport:'Emulator',status:'规划模板',symbol:'V',accent:['#555977','#28354e'],modules:['rng','encounter','party','save'],summary:'Gen5 RNG、队伍数据和进程识别均待实现。'},
{id:'xy',title:'Pokémon X / Y',zh:'宝可梦 X / Y',platform:'gen6',generation:'GEN VI',runtime:'Azahar（候选）',transport:'Emulator',status:'规划模板',symbol:'VI',accent:['#426994','#283e70'],modules:['encounter','party','save'],summary:'3DS 模拟器地址空间与加密数据结构作为独立后端。'},
{id:'oras',title:'Pokémon Omega Ruby / Alpha Sapphire',zh:'宝可梦 欧米伽红宝石 / 阿尔法蓝宝石',platform:'gen6',generation:'GEN VI',runtime:'Azahar（候选）',transport:'Emulator',status:'规划模板',symbol:'VI',accent:['#855064','#423864'],modules:['encounter','party','save'],summary:'复用 Gen6 公共工具，补丁表和游戏特性独立。'},
{id:'native',title:'Windows Native Game',zh:'PC 原生游戏接入模板',platform:'pc',generation:'WINDOWS',runtime:'Win32 / Win64',transport:'Native',status:'可扩展模板',symbol:'PC',accent:['#425d8a','#222c45'],modules:['process','memory','patch','events','agent'],summary:'适用于非模拟器单机游戏；识别进程、版本、架构与权限。'},
{id:'unity',title:'Unity / Unreal Game Template',zh:'PC 引擎游戏模板',platform:'pc',generation:'WINDOWS',runtime:'Windows 原生进程',transport:'Native',status:'可扩展模板',symbol:'EXE',accent:['#4d5575','#32374a'],modules:['process','memory','patch','agent'],summary:'引擎识别属于可选 metadata，不把 Unity / Unreal 写死在核心。'}
];
const F={
rng:{title:'RNG 监控',desc:'读取随机数状态与推进信息；按游戏版本适配。',icon:'activity',category:'数据分析',risk:'只读优先',scope:'Gen 3–5'},
seed:{title:'Seed 控制',desc:'预览一次写入、锁定与恢复的操作流程。',icon:'sliders',category:'游戏修改',risk:'写入校验',scope:'Gen 3'},
encounter:{title:'遭遇与捕捉',desc:'遭遇、捕捉和相关数据的游戏专用接口。',icon:'game',category:'游戏修改',risk:'需校验',scope:'Gen 3–6'},
warp:{title:'地图与传送',desc:'地图搜索、当前位置与传送参数。',icon:'grid',category:'游戏修改',risk:'需校验',scope:'Gen 3'},
party:{title:'队伍数据',desc:'不同世代的数据解码、只读检查与编辑预览。',icon:'database',category:'数据工具',risk:'需校验',scope:'Gen 3–6'},
save:{title:'存档工具',desc:'备份、校验、导入导出与离线文件处理。',icon:'file',category:'文件工具',risk:'备份优先',scope:'Gen 3–6'},
process:{title:'进程监控',desc:'识别进程、架构、模块与版本签名。',icon:'cpu',category:'运行时',risk:'只读优先',scope:'PC Native'},
memory:{title:'内存观察',desc:'由授权后端执行地址读取与数值观察。',icon:'activity',category:'内存工具',risk:'只读优先',scope:'PC Native'},
patch:{title:'补丁管理',desc:'补丁预览、冲突检测、生命周期与恢复。',icon:'shield',category:'修改管理',risk:'高风险',scope:'PC Native'},
events:{title:'事件监控',desc:'通过适配器暴露游戏事件与状态变化。',icon:'clock',category:'运行时',risk:'只读优先',scope:'PC Native'},
agent:{title:'Native Agent',desc:'独立部署的原生扩展；高级 Hook 按需启用。',icon:'terminal',category:'高级扩展',risk:'后续阶段',scope:'PC Native'}
};
const key='gt-ui-v3-state';const journalKey='gt-ui-v3-journal';
function load(){try{return JSON.parse(localStorage.getItem(key)||'{}')}catch{return {}}}
const saved=load();let S={route:'library',platform:'all',gameId:'emerald',featureId:'rng',moduleFilter:'all',search:'',theme:saved.theme||'dark',compact:!!saved.compact,custom:Array.isArray(saved.custom)?saved.custom:[],activity:[],...saved};
const allGames=()=>[...defaultGames,...S.custom]; const game=id=>allGames().find(g=>g.id===id)||defaultGames[0];
function persist(){try{localStorage.setItem(key,JSON.stringify({theme:S.theme,compact:S.compact,custom:S.custom,gameId:S.gameId,platform:S.platform}))}catch{}}
function nowTime(){return new Date().toLocaleString('zh-CN',{hour12:false})}
function record(summary){S.activity.unshift({summary,time:nowTime(),kind:'原型交互'});S.activity=S.activity.slice(0,40)}
function toast(t){const el=document.getElementById('toast-root');el.innerHTML=`<div class="toast">${esc(t)}</div>`;setTimeout(()=>{if(el)el.innerHTML=''},3300)}
function listPanel(){let focus=S.route==='workspace'||S.route==='feature';let g=game(S.gameId);const count=k=>k==='all'?allGames().length:allGames().filter(x=>x.platform===k).length;return `<div class="context-brand"><strong>GameTrainer Studio</strong><span>MODULAR GAME WORKSPACE</span></div>${focus?`<div class="context-title">CURRENT GAME</div><button class="context-item active" data-route="workspace">${I('game')}<span style="line-height:1.4;font-size:11px">${esc(g.title)}</span></button><div class="context-title" style="margin-top:21px">GAME MODULES</div><button class="context-item ${S.route==='workspace'?'active':''}" data-route="workspace">${I('home')}<span>工作台</span></button>${g.modules.map(id=>`<button class="context-item ${S.route==='feature'&&S.featureId===id?'active':''}" data-feature="${id}">${I(F[id].icon)}<span>${F[id].title}</span></button>`).join('')}<div class="divider"></div><button class="context-item" data-route="library">${I('grid')}<span>返回游戏库</span></button>`:`<div class="context-title">PLATFORMS</div>${platforms.map(x=>`<button class="context-item ${S.route==='library'&&S.platform===x.id?'active':''}" data-platform="${x.id}"><span class="tiny"></span><span>${x.label}</span><span class="count">${count(x.id)}</span></button>`).join('')}<div class="divider"></div><div class="context-title">QUICK ACCESS</div>${[game(S.gameId),defaultGames.find(x=>x.id==='native')].filter((v,i,a)=>v&&a.findIndex(z=>z.id===v.id)===i).map(g=>`<button class="context-item" data-open-game="${g.id}">${I(g.platform==='pc'?'terminal':'game')}<span style="line-height:1.35;font-size:11px">${esc(g.title)}</span></button>`).join('')}`}<div class="context-bottom"><div class="context-foot"><span class="pill info">ARCHITECTURE V3</span><p><strong>游戏、功能、连接分离</strong></p><p>新增游戏无需重写导航；当前全部是 UI 规划示例。</p></div></div>`}
function title(head,title,sub,extra=''){return `<div class="page-head"><div><div class="page-kicker">${head}</div><h1>${title}</h1><p>${sub}</p></div>${extra}</div>`}
function gameCard(g){let c=g.accent;return `<article class="game-card"><div class="cover" style="--c1:${c[0]};--c2:${c[1]}"><span class="cover-word">${esc(g.generation)}</span><span class="cover-art">${esc(g.symbol)}</span><span class="cover-type">${g.platform==='pc'?'NATIVE PROCESS':'EMULATOR'}</span></div><div class="game-body"><h3>${esc(g.title)}</h3><p class="subline">${esc(g.zh)}</p><div class="game-info"><span class="pill">${esc(g.runtime)}</span><span class="pill ${g.id==='emerald'?'info':''}">${esc(g.status)}</span></div><div class="game-footer"><span>${g.modules.length} 个功能入口 · 设计态</span><button data-open-game="${esc(g.id)}">进入工作台 ${I('arrow')}</button></div></div></article>`}
function libraryPage(){let filtered=allGames().filter(g=>(S.platform==='all'||g.platform===S.platform)&&(`${g.title} ${g.zh} ${g.runtime}`).toLowerCase().includes(S.search.toLowerCase()));return `<div class="intro-banner"><div><div class="page-kicker">ONE HUB · EVERY GAME</div><h2>从 Gen 3 到 PC 原生游戏，统一管理。</h2><p>游戏平台、模拟器与功能模块各自独立。你只需要选择一个游戏，界面就会加载它自己的功能、版本校验与连接方式。</p></div><button class="btn primary" data-action="new-game">${I('plus')} 新增游戏模板</button></div><div class="filters"><div class="seg-tabs">${platforms.map(p=>`<button class="seg ${S.platform===p.id?'active':''}" data-platform="${p.id}">${p.short}</button>`).join('')}</div><input class="field" id="library-search" value="${esc(S.search)}" placeholder="搜索游戏、模拟器…" aria-label="搜索游戏" style="width:210px" /></div><div class="section-title"><h2>${S.platform==='all'?'全部游戏与适配模板':platforms.find(p=>p.id===S.platform)?.label} <span style="font-size:11px;color:var(--muted)">/ ${filtered.length}</span></h2><span class="micro">所列模块均为规划入口，尚未接入真实游戏</span></div>${filtered.length?`<div class="game-grid">${filtered.map(gameCard).join('')}</div>`:`<div class="panel empty">${I('search')}<h3>没有匹配的游戏</h3><p>更换平台或搜索关键词，或新增一个自定义游戏模板。</p></div>`}<p class="footer-note">* Gen3–Gen6 与 PC Native 是产品信息架构，不代表所列模拟器或游戏已经得到实际支持。</p>`}
function overviewPage(){return `${title('STUDIO / OVERVIEW','多游戏控制中心','项目先采用单游戏会话与多模块架构，之后再扩展跨进程和并行会话。','<button class="btn primary" data-route="library">打开游戏库 '+I('arrow')+'</button>')}<div class="intro-banner"><div><div class="page-kicker">BUILT FOR EXTENSION</div><h2>一个核心，多代游戏，多种运行时。</h2><p>从 Pokémon Emerald 的 mGBA 迁移起步，逐步增加 NDS、3DS 和 Windows 单机游戏。每一层均有独立职责与权限边界。</p></div><button class="btn" data-route="modules">查看模块架构 ${I('arrow')}</button></div><div class="metric-grid" style="margin-top:18px"><div class="metric-card"><span class="label">目录示例</span><strong class="num">${allGames().length}</strong><small>内置游戏与扩展模板</small></div><div class="metric-card"><span class="label">平台类别</span><strong class="num">5</strong><small>Gen3 / Gen4 / Gen5 / Gen6 / PC</small></div><div class="metric-card"><span class="label">真实会话</span><strong>未连接</strong><small>没有连接或内存修改发生</small></div></div><div class="section-title"><h2>快速开始</h2></div><div class="game-grid">${[defaultGames[0],defaultGames[5],defaultGames[7]].map(gameCard).join('')}</div>`}
function sessionCard(g){return `<section class="panel pad"><div class="label">SESSION INSPECTOR</div><div class="status-block">${I('alert')}<div><b>未连接 · 设计演示</b><span>当前没有附加任何真实进程</span></div></div>${[['目标平台',g.platform==='pc'?'Windows Native':g.generation],['建议 Runtime',g.runtime],['连接模式',g.platform==='pc'?'Win32 API / Agent（规划）':'模拟器内存 / Bridge（规划）'],['Process ID','—'],['版本 Profile','未检测'],['写入能力','锁定']].map(([a,b])=>`<div class="info-row"><span>${esc(a)}</span><b>${esc(b)}</b></div>`).join('')}<div class="divider"></div><button class="btn" style="width:100%" data-action="connect">${I('plug')} 选择运行进程（流程演示）</button><p class="small-note" style="margin:11px 0 0">可写操作必须通过运行时、游戏版本与会话共同验证；UI 本身不提供任意地址写入能力。</p></section>`}

function workspacePage(){const g=game(S.gameId);return `<div class="game-hero" style="--c1:${g.accent[0]};--c2:${g.accent[1]}"><div class="game-hero-art">${esc(g.symbol)}</div><div class="game-hero-info"><div class="row wrap"><span class="pill info">${esc(g.generation)}</span><span class="pill">${g.transport==='Native'?'Native Process':'Emulator'}</span><span class="pill warn">尚未连接</span></div><h1>${esc(g.title)}</h1><p>${esc(g.zh)} · ${esc(g.runtime)} · ${esc(g.status)}</p><p style="max-width:630px">${esc(g.summary)}</p></div><div class="game-hero-actions"><button class="btn primary" data-action="connect">${I('plug')} 连接游戏</button><button class="btn" data-route="library">${I('grid')} 切换游戏</button></div></div><div class="workspace-grid"><div class="work-main"><div class="metric-grid"><div class="metric-card"><span class="label">CURRENT PROFILE</span><strong style="font-size:18px">待验证</strong><small>版本签名 / 地址映射</small></div><div class="metric-card"><span class="label">FEATURE PACKS</span><strong class="num">${g.modules.length}</strong><small>动态生成的模块入口</small></div><div class="metric-card"><span class="label">WRITE PERMISSION</span><strong style="font-size:18px;color:var(--amber)">Locked</strong><small>未连接时不可写</small></div></div><div class="section-title"><h2>功能工作区</h2><small>根据 Game Adapter 的 FeatureDescriptor 自动生成</small></div><div class="feature-grid">${g.modules.map(id=>{let f=F[id];return `<button class="feature-card" data-feature="${id}"><div class="feature-top"><span class="feature-icon">${I(f.icon)}</span><span class="pill">${f.risk}</span></div><strong>${f.title}</strong><p>${f.desc}</p><div class="row"><span class="micro">${f.category}</span><span class="arrow">${I('arrow')}</span></div></button>`}).join('')}</div><div class="section-title"><h2>扩展说明</h2></div><div class="panel pad"><div class="row" style="align-items:start">${I('layers')}<div><b>一个游戏包声明自己的 Runtime、版本 Profile 和功能模块。</b><p class="note">不同世代的游戏不应共用未经验证的内存地址；PC 原生游戏也不应被硬塞进“模拟器”类别。核心平台只负责统一授权、生命周 function featurePage(){const g=game(S.gameId),f=F[S.featureId]||F.rng;let pc=g.platform==='pc';const target=pc?'进程内存地址（演示值）':'目标参数（演示值）';return `<div class="feature-shell"><div class="row wrap" style="margin-bottom:20px"><button class="btn ghost" data-route="workspace">← 返回工作台</button><span class="pill">${esc(g.title)}</span><span class="pill info">${esc(f.category)}</span></div><div class="feature-lead"><span class="feature-icon">${I(f.icon)}</span><div><h1>${f.title}</h1><p>${f.desc}</p></div></div><div class="workspace-grid"><div class="work-main"><div class="panel pad"><div class="row space"><strong style="font-size:13px">模块详情与交互预览</strong><span class="pill warn">设计态 · 禁止执行</span></div><div class="divider"></div><div class="form-grid"><div><label class="input-label">${target}</label><input class="field num" id="target-value" value="${pc?'0x00000000':'0x12345678'}" aria-label="目标参数" /></div><div><label class="input-label">执行模式</label><select class="field" id="op-mode" aria-label="执行模式"><option value="read">只读分析</option><option value="preview">修改预览（不会执行）</option></select></div></div><p class="note">此处是可复用的 SchemaForm 示例。实际字段由模块的 typed descriptor 定义，复杂模块可以注册独立 React 组件。</p><div class="callout">${I('alert')}<span><strong>未通过会话与版本校验。</strong>真实产品应在 Rust 核心验证目标、权限、补丁冲突和恢复策略。当前仅能打开静态预览。</span></div><div class="row" style="margin-top:17px;justify-content:flex-end"><button class="btn primary" data-action="preview-feature">${I('shield')} 预览操作</button></div></div><div class="section-title"><h2>模块元数据</h2></div><div class="panel pad">${[['Feature ID',`features.${pc?'pc':g.platform}.${S.featureId}`],['Game Adapter',`games.${g.id}`],['适用范围',f.scope],['权限等级',f.risk],['实现状态','计划 / UI 演示']].map(([k,v])=>`<div class="info-row"><span>${esc(k)}</span><b class="mono">${esc(v)}</b></div>`).join('')}</div></div><aside class="work-aside">${sessionCard(g)}</aside></div></div>`}
function modulesPage(){let arr=Object.entries(F).filter(([k,f])=>S.moduleFilter==='all'||(S.moduleFilter==='emulator'? !['process','memory','patch','events','agent'].includes(k):['process','memory','patch','events','agent'].includes(k)));return `${title('EXTENSION REGISTRY','模块与适配器','功能插件、游戏适配器和 Runtime Provider 独立管理。安装或升级一个模块，不应破坏其他游戏。','<button class="btn" data-action="manifest">'+I('code')+' 查看模块 Manifest</button>')}<div class="panel pad"><div class="row wrap" style="justify-content:space-between"><div><b>插件契约 v1（方案）</b><p class="small-note">Runtime Provider → Game Adapter → Feature Pack → UI Schema</p></div><span class="pill info">Rust 内置注册优先 · 后续 WASM</span></div></div><div class="filters"><div class="seg-tabs"><button class="seg ${S.moduleFilter==='all'?'active':''}" data-module-filter="all">全部功能</button><button class="seg ${S.moduleFilter==='emulator'?'active':''}" data-module-filter="emulator">模拟器功能</button><button class="seg ${S.moduleFilter==='native'?'active':''}" data-module-filter="native">原生功能</button></div><span class="micro">共 ${arr.length} 个功能描述符 · 均未真实安装</span></div><div class="module-list">${arr.map(([id,f])=>`<article class="module-item"><span class="feature-icon">${I(f.icon)}</span><div class="grow"><h3>${f.title} <span class="pill">${f.category}</span></h3><p>${f.desc}</p><div class="badge-group"><span class="micro mono">features.${id}</span><span class="pill">${f.scope}</span><span class="pill warn">规划中</span></div></div><button class="btn" data-action="manifest" data-manifest-id="${id}">接口</button></article>`).join('')}</div>`}
function sessionsPage(){return `${title('RUNTIME MANAGER','连接与运行时','将模拟器虚拟内存、外部进程读写和可选 Native Agent 分成三种独立后端。')}<div class="intro-banner"><div><div class="page-kicker">NO ACTIVE CONNECTION</div><h2>当前没有实际连接。</h2><p>这里展示未来的 Runtime Provider 管理界面。选择进程、探测游戏版本及启用写入，必须由 Rust 后端完成。</p></div><button class="btn" data-action="connect">${I('plug')} 查看连接流程</button></div><div class="section-title"><h2>运行时适配方式</h2></div><div class="game-grid">${[{name:'Emulator Memory',desc:'GBA / NDS / 3DS 虚拟地址映射、进程识别与会话管理。',ic:'game',cap:'mGBA / melonDS / Azahar（候选）'},{name:'Emulator Bridge',desc:'可选模拟器脚本或扩展接口，按产品版本独立实现。',ic:'code',cap:'本地 IPC / 只授权已验证命令'},{name:'Win32 / Native Agent',desc:'Windows 外部进程访问与可选的原生 Hook 模块。',ic:'cpu',cap:'Process API / MinHook（后续）'}].map(x=>`<article class="panel pad"><div class="feature-icon" style="margin-bottom:15px">${I(x.ic)}</div><h3 style="font-size:14px;margin:0 0 7px">${x.name}</h3><p class="note">${x.desc}</p><div class="divider"></div><span class="micro">${x.cap}</span></article>`).join('')}</div>`}
function activityPage(){return `${title('ACTIVITY / AUDIT','操作记录','这里只展示当前 UI 演示中发生的交互，不是游戏操作日志；真实版本由 SQLite 单独持久化。','<button class="btn" data-action="export-activity">'+I('download')+' 导出原型记录</button>')}${S.activity.length?`<div class="audit-list">${S.activity.map(a=>`<div class="audit-row"><span class="feature-icon">${I('clock')}</span><div class="grow"><strong>${esc(a.summary)}</strong><p>${esc(a.time)} · ${esc(a.kind)} · 未修改任何游戏数据</p></div><span class="pill">Demo</span></div>`).join('')}</div>`:`<div class="panel empty">${I('clock')}<h3>还没有原型交互记录</h3><p>选择游戏、添加模板或预览操作后，这里会记录 UI 行为；不代表已执行真实修改。</p></div>`}`}
const diarySeed=`# GameTrainer Studio · 开发日记\n\n日期：2026-11-23\n\n## 今日规划\n- UI 从 Emerald 单游戏工作台升级为多游戏库。\n- 支持 Gen3 / Gen4 / Gen5 / Gen6 / Windows 原生游戏的独立分类。\n- Runtime、Game Adapter、Feature Pack、UI Schema 分层。\n- 每个游戏动态注册功能，不使用固定导航。\n- 系统诊断日志、修改操作历史、开发日记互相独立。\n\n## 下一步\n- [ ] 实现 React + TypeScript 的组件层和路由。\n- [ ] Rust 模块注册与 Profile 验证。\n- [ ] mGBA Emerald 接入与只读测试。\n- [ ] 增加第二款模拟器游戏和 PC Mock 验证可扩展性。\n\n关联：[[GameTrainer]] [[2026-11-23]]`;

function settingsPage(){return `${title('PREFERENCES','工作台设置','先统一视觉系统、交互密度及安全规则，之后再增加运行时路径和插件权限配置。')}<div class="settings-grid"><section class="panel settings-section"><h3>外观</h3><div class="settings-row"><div><strong>浅色模式</strong><p>默认保留 Dark Control 视觉语言</p></div><button class="sw ${S.theme==='light'?'on':''}" data-action="toggle-theme" role="switch" aria-checked="${S.theme==='light'}" aria-label="浅色模式"></button></div><div class="settings-row"><div><strong>紧凑型卡片</strong><p>用于较小的笔记本或高密度游戏库</p></div><button class="sw ${S.compact?'on':''}" data-action="toggle-compact" role="switch" aria-checked="${S.compact}" aria-label="紧凑卡片"></button></div></section><section class="panel settings-section"><h3>设计原则</h3>${[['连接权限','默认只读 / 未验证'],['新游戏接入','独立 Adapter + Profile'],['新功能','FeatureDescriptor 自动注册'],['PC 原生 Hook','独立 Agent，按需启用'],['笔记记录','手动确认导出']].map(([a,b])=>`<div class="info-row"><span>${a}</span><b>${b}</b></div>`).join('')}</section></div><div class="section-title"><h2>原型数据</h2></div><div class="panel pad"><p class="note">可新增自定义游戏模板和修改日记草稿。数据仅保存在当前浏览器，和真实产品的 SQLite 存储无关。</p><button class="btn danger" data-action="reset-demo">清空本地自定义模板与原型记录</button></div>`}

function go(r){S.route=r;S.search='';render();window.scrollTo({top:0,behavior:'instant'});try{history.replaceState(null,'',`#${r}`)}catch{}}

function showManifest(id='rng'){let f=F[id]||F.rng;const data={api_version:'1',module_id:`features.${id}`,module_type:'feature',module_version:'0.1.0-dev',name:f.title,capabilities:['session.read','ui.register'],supported_scope:f.scope,status:'design-only'};modal('Feature Manifest · 接口草案',`<p class="note">这是说明性示例，不代表存在可以加载的插件文件。</p><div class="codebox">${esc(JSON.stringify(data,null,2))}</div>`)}
function exportFile(name,content,type){const blob=new Blob([content],{type:type||'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportActivity(){let lines=['time,kind,event',...S.activity.map(a=>[a.time,a.kind,a.summary].map(t=>'"'+String(t).replace(/"/g,'""')+'"').join(','))];exportFile('GameTrainer-V3-demo-activity.csv','\ufeff'+lines.join('\r\n'),'text/csv;charset=utf-8');toast('已导出原型交互记录（非真实游戏操作）')}
function copyJournal(){const val=document.getElementById('journal-editor')?.value||'';if(navigator.clipboard?.writeText)navigator.clipboard.writeText(val).then(()=>toast('已复制日记 Markdown')).catch(()=>toast('复制受浏览器限制，请使用文本框复制'));else toast('当前浏览器不支持直接复制，请使用文本框复制')}
function resetDemo(){if(!confirm('清空自定义游戏模板与当前原型交互记录？开发日记草稿不会删除。'))return;S.custom=[];S.activity=[];S.platform='all';S.gameId='emerald';record('原型数据重置');go('library')}
function commandPalette(){modal('快速搜索 · Ctrl K',`<div class="row" style="border:1px solid var(--border2);border-radius:10px;padding:2px 11px;background:var(--bg)">${I('search')}<input class="field" style="border:0;background:transparent;flex:1" id="cmd-query" placeholder="搜索游戏名称或页面…" autocomplete="off"/></div><div class="command-list" id="command-results"></div>`);updateCommands('')}
function updateCommands(q){const root=document.getElementById('command-results');if(!root)return;const routes=[['library','游戏库'],['modules','模块中心'],['sessions','运行时与连接'],['journal','开发日记'],['activity','操作记录'],['settings','设置']];let match=[...allGames().filter(g=>`${g.title} ${g.zh}`.toLowerCase().includes(q.toLowerCase())).map(g=>({id:g.id,label:g.title,sub:'游戏 · '+g.runtime,kind:'game'})),...routes.filter(x=>x[1].includes(q)).map(x=>({id:x[0],label:x[1],sub:'导航页面',kind:'route'}))];root.innerHTML=match.length?match.slice(0,12).map(x=>`<button class="command-item" data-command-${x.kind}="${esc(x.id)}">${I(x.kind==='game'?'game':'grid')}${esc(x.label)}<small>${esc(x.sub)}</small></button>`).join(''):'<div class="empty" style="padding:18px">没有匹配结果</div>'}
// Central event delegation keeps added games and feature lists functional without hardcoding per-game menus.
document.addEventListener('click',e=>{let t=e.target.closest('[data-route],[data-platform],[data-open-game],[data-feature],[data-module-filter],[data-action],[data-manifest-id],[data-command-game],[data-command-route]');if(!t)return;if(t.dataset.commandGame){closeModal();chooseGame(t.dataset.commandGame);return}if(t.dataset.commandRoute){closeModal();go(t.dataset.commandRoute);return}if(t.dataset.route){go(t.dataset.route);return}if(t.dataset.platform){S.platform=t.dataset.platform;go('library');return}if(t.dataset.openGame){chooseGame(t.dataset.openGame);return}if(t.dataset.feature){showFeature(t.dataset.feature);return}if(t.dataset.moduleFilter){S.moduleFilter=t.dataset.moduleFilter;render();return}if(t.dataset.manifestId){showManifest(t.dataset.manifestId);return}let a=t.dataset.action;if(!a)return;if(a==='overlay-close'){if(e.target===t)closeModal();return}({command:commandPalette,'new-game':addGame,'save-game':saveGame,'close-dialog':closeModal,connect:showConnection,'preview-feature':showPreview,manifest:()=>showManifest(), 'export-activity':exportActivity,'journal-copy':copyJournal,'journal-download':()=>{exportFile('2026-11-23-GameTrainer-UI-V3.md',document.getElementById('journal-editor').value,'text/markdown;charset=utf-8');toast('Markdown 已保存为下载文件，未写入 Obsidian')},'toggle-theme':()=>{S.theme=S.theme==='dark'?'light':'dark';render()},'toggle-compact':()=>{S.compact=!S.compact;render()},'reset-demo':resetDemo})[a]?.()});
document.addEventListener('input',e=>{if(e.target.id==='library-search'){S.search=e.target.value;let pos=e.target.selectionStart;render();let target=document.getElementById('library-search');target?.focus();target?.setSelectionRange(pos,pos)}if(e.target.id==='journal-editor'){try{localStorage.setItem(journalKey,e.target.value)}catch{}document.getElementById('journal-preview').textContent=e.target.value}if(e.target.id==='cmd-query')updateCommands(e.target.value)});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();commandPalette()}if(e.key==='Escape')closeModal();if(e.key==='Enter'&&e.target.closest('#add-game-form')){e.preventDefault();saveGame()}});
render();
</script>
</body>
</html>
